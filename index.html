<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to POS</title>
    <link rel="icon" type="image/x-icon" href="img/menulux_logo_circle.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        /* Universal Box Model Reset */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: rgb(46, 87, 121);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }

        /* Main Center Wrapper */
        .page-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 480px; /* Fluid maximum width for desktop */
        }

        /* Logo and Header Styling */
        .div0 {  
            background-color: white;
            border-radius: 50%;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .item3 {
            margin-bottom: 6px;
            color: #E1B12C;
            font-size: 28px;
            text-align: center;
        }

        .item4 {
            color: #e2c061;
            font-size: 16px;
            text-align: center;
            margin-bottom: 4px;
        }

        .item7 {
            color: rgba(218, 204, 218, 0.89);
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
        }

        /* Form Card Container */
        .div1 { 
            width: 100%;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.92);
            padding: 30px 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .div1 h1 {
            color: rgb(46, 87, 121);
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Input Fields */
        .item0 {
            width: 100%;
            height: 46px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid rgba(46, 87, 121, 0.2);
            padding: 0 15px;
            background-color: rgba(255, 255, 255, 0.7);
            color: rgb(46, 87, 121);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .item0:focus {
            background-color: #ffffff;
            border-color: #E1B12C;
        }

        .item0::placeholder {
            color: rgb(46, 87, 121);
            opacity: 0.8;
        }

        /* Remember Me Layout */
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .item5 {
            width: 18px;
            height: 18px;
            accent-color: #E1B12C;
            cursor: pointer;
        }

        .item6 {
            color: rgb(46, 87, 121);
            font-size: 15px;
            font-weight: normal;
        }

        /* Submit Button */
        .item1 {
            height: 48px;
            width: 100%;
            border-radius: 20px;
            border: none;
            background-color: #E1B12C;
            color: rgb(46, 87, 121);
            font-weight: bold;
            font-size: 17px;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .item1:hover {
            opacity: 0.9;
        }

        /* Error / Status Message */
        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <!-- Logo Header -->
        <img class="div0" src="img/logo.png" height="110" width="110" alt="Logo">
        <h1 class="item3">MENULUX POS</h1>
        <p class="item4">Welcome to the Restaurant POS System</p>
        <p class="item7">Log in with your account to continue</p>

        <!-- Form Card Wrapper -->
        <div class="div1">
            <h1>Log In</h1>
            
            <form onsubmit="event.preventDefault(); validateLogin();">
                <input class="item0" type="text" placeholder="👤 Username" id="username" required>
                <input class="item0" type="password" placeholder="🔒 Password" id="password" required>
                
                <label class="checkbox-container">
                    <input class="item5" type="checkbox" id="rememberMe">
                    <span class="item6">Remember Me</span>
                </label>

                <button class="item1" type="submit">Log In ➤</button>
            </form>

            <p id="message"></p>
        </div>
    </div>

    <script>
        function validateLogin() {
            const CORRECT_USERNAME = "admin";
            const CORRECT_PASSWORD = "123";
            const TARGET_PAGE = "dashboard.html";

            const inputUsername = document.getElementById('username').value.trim();
            const inputPassword = document.getElementById('password').value;
            const messageElement = document.getElementById('message');

            if (inputUsername === CORRECT_USERNAME && inputPassword === CORRECT_PASSWORD) {
                messageElement.style.color = "#2e7d32";
                messageElement.textContent = "Logging in...";
                
                window.location.href = TARGET_PAGE;
            } else {
                messageElement.style.color = "#d32f2f";
                messageElement.textContent = "Invalid Username or Password!";
                document.getElementById('password').value = "";
            }
        }
    </script>
</body>
</html>
