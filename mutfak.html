<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Welcome</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        /* Base & CSS Variables */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-body: #f3f2f2;
            --surface: #ffffff;
            --primary-navy: #1e3450;
            --primary-gold: #E1B12C;
            --text-muted: rgba(133, 132, 129, 0.85);
            --border-color: #e2e8f0;
            --success-green: #2abe63;
        }

        body {
            background-color: var(--bg-body);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: var(--primary-navy);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        a {
            text-decoration: none;
        }

        /* Responsive Navigation Header */
        .div0 {  
            position: sticky;
            top: 0;
            background-color: var(--bg-body);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            width: 100%;
            padding: 0 24px;
            border-bottom: silver 1px solid;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .item19 {
            font-size: 20px;
            color: var(--primary-gold);
            background-color: var(--bg-body);
            border: var(--primary-gold) solid 2px;
            cursor: pointer;
            border-radius: 50%;
            height: 38px;
            width: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .item19:hover {
            background-color: var(--primary-gold);
            color: white;
        }

        .item20 {
            color: var(--primary-navy);
            font-size: 19px;
            font-weight: bold;
            line-height: 1.2;
            margin: 0;
        }

        .item21 {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: normal;
            margin: 0;
        }

        .item22 {
            border-radius: 12px;
            border: none;
            height: 35px;
            padding: 0 20px;
            background-color: var(--primary-gold);
            color: var(--primary-navy);
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            flex-shrink: 0;
        }

        .item22:hover {
            opacity: 0.9;
        }

        .item22:active {
            transform: scale(0.97);
        }

        /* Main Container Layout */
        .main-container {
            width: 100%;
            max-width: 1280px;
            padding: 20px 16px 40px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Kitchen Management Navigation Bar */
        .div1 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            list-style: none;
            width: 100%;
        }

        .div1 li {
            width: 100%;
        }

        .div1 button {
            height: 48px;
            width: 100%;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .div1 button:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .div1 button:active {
            transform: translateY(0);
        }

        .div1 button span {
            font-size: 18px;
        }

        .item10 {
            background-color: rgb(29, 61, 102);
            color: white;
        }
        .item10 span { color: rgb(241, 203, 203); }

        .item11 {
            background-color: #E1B12C;
            color: rgb(30, 52, 80);
        }
        .item11 span { color: rgb(30, 52, 80); }

        .item12 {
            background-color: rgb(55, 118, 177);
            color: white;
        }
        .item12 span { color: rgb(241, 203, 203); }

        .item13 {
            background-color: rgb(207, 29, 44);
            color: white;
        }
        .item13 span { color: rgb(241, 203, 203); }

        /* Section Title */
        .div2 {
            width: 100%;
        }

        .item3 {
            color: var(--primary-navy);
            font-size: 20px;
            font-weight: bold;
        }

        /* Order Cards Display Area */
        #kitchenOrders {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .order-card-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .div3 {
            width: 100%;
            height: 56px;
            background-color: rgb(226, 226, 226);
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .div3 h2 {
            font-size: 18px;
            color: var(--primary-navy);
            margin: 0;
            font-weight: bold;
        }

        .div3 h3 {
            font-size: 16px;
            color: rgb(130, 130, 130);
            margin: 0;
            font-weight: normal;
        }

        .div4 {
            width: 100%;
            background-color: var(--surface);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            padding: 20px;
            box-sizing: border-box;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            border: rgb(226, 226, 226) 1px solid;
            border-top: none;
            align-items: center;
        }

        .item4 {
            font-size: 16px;
            color: rgb(46, 87, 121);
            margin: 0;
            font-weight: 600;
        }

        .item6 {
            font-size: 15px;
            color: var(--primary-gold);
            font-weight: bold;
            margin: 0;
        }

        .item7 {
            border-radius: 10px;
            background-color: var(--success-green);
            color: white;
            height: 40px;
            min-width: 115px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            justify-self: end;
            transition: opacity 0.2s ease, transform 0.1s ease;
            padding: 0 16px;
        }

        .item7:hover {
            opacity: 0.9;
        }

        .item7:active {
            transform: scale(0.96);
        }

        /* Mobile Layout Optimizations */
        @media (max-width: 640px) {
            .div0 {
                padding: 0 16px;
            }

            .item20 {
                font-size: 16px;
            }

            .item21 {
                font-size: 11px;
            }

            .item22 {
                padding: 0 12px;
                font-size: 12px;
            }

            .div1 {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .div1 button {
                height: 44px;
                font-size: 11px;
            }

            .div3 {
                padding: 0 14px;
                height: 50px;
            }

            .div3 h2 {
                font-size: 15px;
            }

            .div3 h3 {
                font-size: 14px;
            }

            .div4 {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 16px 14px;
            }

            .item7 {
                justify-self: stretch;
                width: 100%;
            }
        }
    </style>

    <script>
        const ORDER_ID_KEY = "menulux_order_counter";

        function logout() {
            window.location.href = "index.html";
        }
        function MENU() {
            window.location.href = "menular.html";
        }
        function EKLE() {
            window.location.href = "ekle.html";
        }
        function DÜZENLE() {
            window.location.href = "düzenle.html";
        }
        function SİL() {
            window.location.href = "sil.html";
        }

    document.addEventListener("DOMContentLoaded", () => {
      const KITCHEN_QUEUE_KEY = "menulux_kitchen_queue_v1";
      const wrap = document.getElementById("kitchenOrders");

      function loadQueue() {
        try { return JSON.parse(localStorage.getItem(KITCHEN_QUEUE_KEY)) || []; }
        catch { return []; }
      }

      function saveQueue(arr) {
        localStorage.setItem(KITCHEN_QUEUE_KEY, JSON.stringify(arr));
      }

      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatOrderId(id) {
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const num = Number(id) || 0;
        const letter = letters[num % 26];
        const number = String((num % 99) + 1).padStart(2, "0");
        return letter + number;
      }

      function render() {
        const q = loadQueue();

        if (q.length === 0) {
          wrap.innerHTML = `<p style="padding:10px 0; color:rgb(130,130,130);">No orders.</p>`;
          return;
        }

        wrap.innerHTML = q.map((o) => {
          const itemsHtml = o.items.map(it => `<p class="item4">${it.qty}x ${escapeHtml(it.name)}</p>`).join("");
          
          // Translate status if stored as Turkish in localStorage
          const statusText = (o.status === "Bekleniyor" || !o.status) ? "Pending" : o.status;

          return `
            <div class="order-card-group">
                <div class="div3">
                  <h2>Table ${escapeHtml(o.masaId)} - Waiter</h2>
                  <h3>Order #${formatOrderId(o.id)}</h3>
                </div>

                <div class="div4">
                  ${itemsHtml}
                  <h4 class="item6">${escapeHtml(statusText)}</h4>
                  <input type="button" class="item7" value="Prepare" data-done="${o.id}">
                </div>
            </div>
          `;
        }).join("");

        wrap.querySelectorAll("[data-done]").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-done");
            let q = loadQueue();
            q = q.filter(x => String(x.id) !== String(id));
            saveQueue(q);
            render();
          });
        });
      }

      render();
    });
    </script>
</head>

<body>
    <!-- Top Header Navigation -->
    <header class="div0">
        <div class="header-left">
            <a href="dashboard.html">
                <span class="material-symbols-outlined item19">replay</span>
            </a>
            <div>
                <h1 class="item20">KITCHEN PANEL</h1>
                <p class="item21">Welcome, Ayşe Yılmaz</p>
            </div>
        </div>
        <input class="item22" type="button" value="Log Out" onclick="logout()">
    </header>

    <!-- Main Viewport Area -->
    <main class="main-container">
        <!-- Control Actions -->
        <ul class="div1">
            <li><button class="item10" onclick="MENU()"><span class="material-symbols-outlined">visibility</span> MENU</button></li>
            <li><button class="item11" onclick="EKLE()"><span class="material-symbols-outlined">add</span> ADD PRODUCT</button></li>
            <li><button class="item12" onclick="DÜZENLE()"><span class="material-symbols-outlined">edit</span> EDIT PRODUCT</button></li>
            <li><button class="item13" onclick="SİL()"><span class="material-symbols-outlined">delete</span> DELETE PRODUCT</button></li>
        </ul>

        <!-- Kitchen Status List -->
        <section class="div2">
            <h2 class="item3">ORDERS IN PREPARATION</h2>
        </section>

        <!-- Orders Queue Output -->
        <div id="kitchenOrders"></div>
    </main>
</body>
</html>
