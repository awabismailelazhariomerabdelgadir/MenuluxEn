<!-- ========================= gecmis.html ========================= -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Payment History</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        /* Base Reset & Setup */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f3f4f6;
            font-family: Arial, sans-serif;
            color: rgb(30, 52, 80);
            min-height: 100vh;
        }

        a {
            text-decoration: none;
        }

        /* Top Header Navigation */
        .div0 {  
            background-color: #ffffff;
            display: flex;
            align-items: center;
            height: 70px;
            width: 100%;
            padding: 0 20px;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-link {
            display: inline-flex;
        }

        .item0 {
            font-size: 20px;
            color: #E1B12C;
            background-color: #ffffff;
            border: #E1B12C solid 2px;
            cursor: pointer;
            border-radius: 50%;
            height: 38px;
            width: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
        }

        .item0:hover {
            background-color: #E1B12C;
            color: #ffffff;
        }

        .item1 {
            color: rgb(30, 52, 80);
            font-size: 20px;
            font-weight: bold;
        }

        /* Container Layout Wrapper */
        .main-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Responsive Search & Filtering Controls Grid */
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            width: 100%;
            background-color: #ffffff;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .input-field {
            background-color: #f9fafb;
            height: 42px;
            border: 1px solid #d1d5db;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 15px;
            color: rgb(30, 52, 80);
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #E1B12C;
            background-color: #ffffff;
        }

        /* Filter Action Buttons */
        .date-btn {
            background-color: rgb(110, 129, 151);
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            height: 42px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .date-btn:hover {
            opacity: 0.9;
        }

        /* Payment History List Cards */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 10px;
        }

        .div2 {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border-left: 6px solid rgb(46, 167, 82);
            flex-wrap: wrap;
        }

        .card-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item9 {
            color: rgb(24, 24, 24);
            font-size: 18px;
            font-weight: bold;
        }

        .item10 {
            color: rgb(100, 100, 100);
            font-size: 14px;
        }

        .item11 {
            color: #E1B12C;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }

        .card-right {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: auto;
        }

        .item12 {
            font-size: 22px;
            font-weight: bold;
            color: rgb(46, 167, 82);
        }

        .item77 {
            font-size: 26px;
            color: rgb(200, 50, 50);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .item77:hover {
            transform: scale(1.1);
        }

        .empty-msg {
            padding: 30px;
            color: #888888;
            text-align: center;
            background: #ffffff;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <header class="div0">
        <a href="kasa.html" class="back-link">
            <span class="material-symbols-outlined item0">replay</span>
        </a>
        <h1 class="item1">📝 Payment History</h1>
    </header>

    <!-- Main Container -->
    <main class="main-wrapper">
        
        <!-- Filter Controls -->
        <section class="filter-grid">
            <input id="searchOrder" class="input-field" placeholder="Order No">
            <input id="searchTable" class="input-field" placeholder="Table No">
            <input id="minPrice" type="number" class="input-field" placeholder="Min. Amount ($)">
            <input id="maxPrice" type="number" class="input-field" placeholder="Max. Amount ($)">
            <button class="date-btn" id="dateFilterBtn">
                <span>🗓️ Select Date</span>
            </button>
            <input type="date" id="historyDatePicker" style="display: none;">
        </section>

        <!-- Payment Records Container -->
        <div class="history-list" id="historyList"></div>

    </main>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const CASH_HISTORY_KEY = "menulux_cash_history_v1";

        const orderInput = document.getElementById("searchOrder");
        const tableInput = document.getElementById("searchTable");
        const minInput = document.getElementById("minPrice");
        const maxInput = document.getElementById("maxPrice");

        const wrap = document.getElementById("historyList");
        const dateBtn = document.getElementById("dateFilterBtn");
        const picker = document.getElementById("historyDatePicker");

        let selectedDate = "";

        /* Formatters */
        function formatOrderId(id) {
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const num = Number(id) || 0;
            const letter = letters[num % 26];
            const number = String((num % 99) + 1).padStart(2, "0");
            return letter + number;
        }

        function loadHistory() {
            try { return JSON.parse(localStorage.getItem(CASH_HISTORY_KEY)) || []; }
            catch { return []; }
        }

        function saveHistory(arr) {
            localStorage.setItem(CASH_HISTORY_KEY, JSON.stringify(arr));
        }

        function showDetails(order) {
            let itemsText = "";

            if (order.items && order.items.length > 0) {
                itemsText = order.items.map(i => `${i.qty}x ${i.name}`).join("\n");
            } else {
                itemsText = "(No product info recorded)";
            }

            alert(
`Order: ${formatOrderId(order.id)}

Table: ${order.masaId}

Date: ${order.date}

Products:
${itemsText}

Total: $${Number(order.total).toFixed(2)}`
            );
        }

        /* Trigger hidden native HTML5 datepicker */
        dateBtn.addEventListener("click", () => {
            if (picker.showPicker) {
                picker.showPicker();
            } else {
                picker.click();
            }
        });

        picker.addEventListener("change", () => {
            selectedDate = picker.value;
            dateBtn.innerHTML = selectedDate ? `🗓️ ${selectedDate}` : `🗓️ Select Date`;
            render();
        });

        function render() {
            let history = loadHistory();

            const orderVal = orderInput.value.trim().toUpperCase();
            const tableVal = tableInput.value.trim();
            const minVal = parseFloat(minInput.value);
            const maxVal = parseFloat(maxInput.value);

            let data = history
                .map((o, index) => ({ ...o, historyIndex: index }))
                .filter(o => {
                    if (orderVal && !formatOrderId(o.id).includes(orderVal)) return false;
                    if (tableVal && !String(o.masaId).includes(tableVal)) return false;
                    if (!isNaN(minVal) && Number(o.total) < minVal) return false;
                    if (!isNaN(maxVal) && Number(o.total) > maxVal) return false;
                    if (selectedDate && o.date !== selectedDate) return false;
                    return true;
                });

            if (data.length === 0) {
                wrap.innerHTML = `<div class="empty-msg">No records found matching specified criteria.</div>`;
                return;
            }

            wrap.innerHTML = data.map(o => `
                <div class="div2">
                    <div class="card-details">
                        <h1 class="item9">TABLE ${o.masaId}</h1>
                        <p class="item10">Date: ${o.date}</p>
                        <span class="item11" data-order-index="${o.historyIndex}">
                            Order No: ${formatOrderId(o.id)}
                        </span>
                    </div>

                    <div class="card-right">
                        <h2 class="item12">$${Number(o.total).toFixed(2)}</h2>
                        <span class="material-symbols-outlined item77" data-delete-index="${o.historyIndex}">
                            delete
                        </span>
                    </div>
                </div>
            `).join("");

            /* Attach click listeners */
            document.querySelectorAll("[data-order-index]").forEach(el => {
                el.addEventListener("click", () => {
                    const index = Number(el.getAttribute("data-order-index"));
                    const history = loadHistory();
                    if (history[index]) showDetails(history[index]);
                });
            });

            document.querySelectorAll("[data-delete-index]").forEach(el => {
                el.addEventListener("click", () => {
                    const index = Number(el.getAttribute("data-delete-index"));
                    deleteOrder(index);
                });
            });
        }

        [orderInput, tableInput, minInput, maxInput].forEach(i => {
            i.addEventListener("input", render);
        });

        function deleteOrder(index) {
            if (!confirm("Are you sure you want to delete this order from history?")) return;

            let history = loadHistory();
            if (index < 0 || index >= history.length) return;

            history.splice(index, 1);
            saveHistory(history);
            render();
        }

        render();
    });
    </script>

</body>
</html>
