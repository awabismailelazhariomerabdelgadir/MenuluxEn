<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Welcome</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        /* Base Reset & Core Variables */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-body: #f3f2f2;
            --surface: #fcfbfb;
            --primary-navy: #182941;
            --secondary-navy: #2e507c;
            --primary-gold: #E1B12C;
            --text-dark: #1e293b;
            --text-muted: rgb(133, 132, 129);
            --border-color: #c0c0c0;
            --danger-red: rgb(200, 30, 30);
        }

        body {
            background-color: var(--bg-body);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Header Navigation */
        .div0 {  
            position: sticky;
            top: 0;
            background-color: var(--surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            width: 100%;
            padding: 0 24px;
            border-bottom: var(--border-color) 1px solid;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-title-group {
            display: flex;
            flex-direction: column;
        }

        .header-subtitle {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: normal;
            margin: 0;
        }

        .item31 {
            color: var(--primary-gold);
            font-size: 22px;
            font-weight: bold;
            margin: 0;
            line-height: 1.2;
        }

        .item34 {
            background-color: var(--primary-gold);
            color: rgb(30, 52, 80);
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border-radius: 12px;
            border: none;
            height: 39px;
            padding: 0 18px;
            transition: opacity 0.2s ease, transform 0.1s ease;
            flex-shrink: 0;
        }

        .item34:hover {
            opacity: 0.9;
        }

        .item34:active {
            transform: scale(0.97);
        }

        .item35 {
            background-color: var(--surface);
            color: var(--primary-gold);
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            border-radius: 50%;
            border: 1px solid var(--primary-gold);
            height: 42px;
            width: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .item35:hover {
            background-color: var(--primary-gold);
            color: white;
        }

        /* Main Workspace Responsive Grid */
        .workspace {
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            display: grid;
            grid-template-columns: 520px 1fr;
            gap: 20px;
            align-items: start;
        }

        /* Left Side: Order Panel */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .div1 {
            background-color: var(--surface);
            border-radius: 12px;
            border-top: var(--border-color) 1px solid;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .order-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .item1 {
            color: var(--primary-gold);
            font-size: 20px;
            font-weight: bold;
            margin: 0;
        }

        .item2 {
            background-color: var(--secondary-navy);
            color: white;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            border-radius: 12px;
            border: none;
            height: 30px;
            padding: 0 14px;
            transition: opacity 0.2s ease;
        }

        .item2:hover {
            opacity: 0.9;
        }

        .divider-line {
            background-color: var(--border-color);
            height: 1px;
            width: 100%;
            border-radius: 12px;
        }

        /* Dynamic Order Items List Box */
        .div2 {
            background-color: var(--primary-navy);
            width: 100%;
            border-top: var(--border-color) 1px solid;
            border-radius: 12px;
            overflow: hidden;
        }

        #orderBox {
            height: 260px;
            padding: 12px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #orderItems {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .order-row {
            display: grid;
            grid-template-columns: 1fr 60px 110px 30px;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
        }

        .order-name {
            color: white;
            font-size: 18px;
            line-height: 1.2;
        }

        .order-qty {
            color: white;
            font-size: 18px;
            text-align: center;
            font-weight: bold;
        }

        .order-price {
            color: white;
            font-size: 18px;
            text-align: right;
            font-weight: bold;
        }

        .order-remove {
            color: var(--primary-gold);
            font-size: 16px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease;
        }

        .order-remove:hover {
            transform: scale(1.2);
        }

        /* Total Display */
        .item8 {
            color: var(--primary-gold);
            background-color: var(--primary-navy);
            height: 50px;
            width: 100%;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        /* Action Buttons Area */
        .div3 {
            background-color: var(--surface);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .item9, .item10, .item11 {
            width: 100%;
            height: 48px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            border-radius: 12px;
            border: none;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        .item9 {
            background-color: var(--primary-gold);
            color: rgb(30, 52, 80);
        }

        .item10 {
            background-color: var(--secondary-navy);
            color: white;
        }

        .item11 {
            background-color: var(--danger-red);
            color: white;
        }

        .item9:hover, .item10:hover, .item11:hover {
            opacity: 0.9;
        }

        .item9:active, .item10:active, .item11:active {
            transform: scale(0.98);
        }

        /* Right Side: iFrame Menu Area */
        #frame {
            width: 100%;
            height: 720px;
            border: none;
            border-radius: 12px;
            border-top: var(--border-color) 1px solid;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .workspace {
                grid-template-columns: 1fr;
            }

            #frame {
                height: 600px;
            }
        }

        @media (max-width: 640px) {
            .div0 {
                padding: 0 16px;
            }

            .item31 {
                font-size: 17px;
            }

            .item34 {
                padding: 0 10px;
                font-size: 12px;
                height: 35px;
            }

            .workspace {
                padding: 12px;
            }

            .order-row {
                grid-template-columns: 1fr 45px 80px 25px;
            }

            .order-name, .order-qty, .order-price {
                font-size: 15px;
            }
        }
    </style>

    <script>
    document.addEventListener("DOMContentLoaded", () => {

      /* ===================== READ TABLE FROM URL ===================== */
      const params = new URLSearchParams(window.location.search);
      const masaId = params.get("masa") || "1";

      /* ===================== UPDATE HEADER TEXT ===================== */
      const headerEl = document.querySelector(".item31");
      if (headerEl) {
        headerEl.textContent = "Table " + masaId + " Order Screen";
      }

      /* ===================== STORAGE KEYS ===================== */
      const PRODUCTS_KEY = "menulux_products_v1";
      const ORDER_KEY = "menulux_order_table_" + masaId + "_v1";
      const KITCHEN_QUEUE_KEY = "menulux_kitchen_queue_v1";
      const CASH_QUEUE_KEY = "menulux_cash_queue_v1";

      const itemsEl = document.getElementById("orderItems");
      const totalEl = document.getElementById("orderTotal");
      const btnKitchen = document.getElementById("btnKitchen");
      const btnCash = document.getElementById("btnCash");

      /* ===================== HELPERS ===================== */
      function loadProducts() {
        try {
          return JSON.parse(localStorage.getItem(PRODUCTS_KEY)) || [];
        } catch {
          return [];
        }
      }

      function loadOrder() {
        try {
          const saved = JSON.parse(localStorage.getItem(ORDER_KEY));

          if (!saved || typeof saved !== "object") {
            return { id: null, items: [] };
          }

          if (!Array.isArray(saved.items)) {
            saved.items = [];
          }

          if (!("id" in saved)) {
            saved.id = null;
          }

          return saved;
        } catch {
          return { id: null, items: [] };
        }
      }

      function saveOrder(order) {
        localStorage.setItem(ORDER_KEY, JSON.stringify(order));
      }

      function formatTL(n) {
        const num = Number(n);
        return (Number.isFinite(num) ? num.toFixed(2) : "0.00") + " TL";
      }

      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function calcTotal(items) {
        return items.reduce((sum, it) => {
          return sum + (Number(it.qty) || 0) * (Number(it.price) || 0);
        }, 0);
      }

      function pushToQueue(queueKey, orderObj) {
        let q = [];
        try {
          q = JSON.parse(localStorage.getItem(queueKey)) || [];
        } catch {
          q = [];
        }

        q.push(orderObj);
        localStorage.setItem(queueKey, JSON.stringify(q));
      }

      /* ===================== UNIQUE ORDER ID ===================== */
      function generateUniqueOrderId() {
        return Date.now() + Math.floor(Math.random() * 1000);
      }

      function ensureOrderId(order) {
        if (!order.id) {
          order.id = generateUniqueOrderId();
          saveOrder(order);
        }
        return order.id;
      }

      /* ===================== SEND ORDER ===================== */
      function sendOrder(where) {
        const order = loadOrder();

        if (!order.items || order.items.length === 0) {
          alert("Order is empty. Please add products first.");
          return;
        }

        const orderId = ensureOrderId(order);
        const total = calcTotal(order.items);

        const payload = {
          id: orderId,
          masaId: String(masaId),
          items: order.items.map(item => ({
            id: item.id,
            name: item.name,
            price: Number(item.price),
            qty: Number(item.qty)
          })),
          total: total,
          status: where === "kitchen" ? "Pending" : "Awaiting Payment",
          createdAt: new Date().toISOString()
        };

        if (where === "kitchen") {
          pushToQueue(KITCHEN_QUEUE_KEY, payload);
          alert("Order sent to kitchen.");
          window.location.href = "mutfak.html";
        } else {
          pushToQueue(CASH_QUEUE_KEY, payload);
          alert("Order sent to cash register.");
          window.location.href = "kasa.html";
        }
      }

      btnKitchen.addEventListener("click", () => sendOrder("kitchen"));
      btnCash.addEventListener("click", () => sendOrder("cash"));

      /* ===================== RENDER ORDER ===================== */
      function renderOrder() {
        const order = loadOrder();

        if (!order.items.length) {
          itemsEl.innerHTML = `
            <div class="order-row">
              <div class="order-name">No items in order.</div>
              <div></div>
              <div></div>
              <div></div>
            </div>
          `;
          totalEl.textContent = "TOTAL: 0.00 TL";
          return;
        }

        let total = 0;

        itemsEl.innerHTML = order.items.map(item => {
          const lineTotal = (Number(item.qty) || 0) * (Number(item.price) || 0);
          total += lineTotal;

          return `
            <div class="order-row">
              <div class="order-name">${escapeHtml(item.name)}</div>
              <div class="order-qty">${item.qty}x</div>
              <div class="order-price">${formatTL(lineTotal)}</div>
              <div class="order-remove" data-remove="${item.id}">X</div>
            </div>
          `;
        }).join("");

        totalEl.textContent = "TOTAL: " + formatTL(total);

        itemsEl.querySelectorAll("[data-remove]").forEach(btn => {
          btn.addEventListener("click", () => {
            removeOne(btn.getAttribute("data-remove"));
          });
        });
      }

      /* ===================== ADD PRODUCT ===================== */
      function addProduct(productId) {
        const products = loadProducts();
        const product = products.find(p => String(p.id) === String(productId));
        if (!product) return;

        const order = loadOrder();

        ensureOrderId(order);

        const existing = order.items.find(i => String(i.id) === String(product.id));

        if (existing) {
          existing.qty += 1;
        } else {
          order.items.push({
            id: product.id,
            name: product.name,
            price: Number(product.price),
            qty: 1
          });
        }

        saveOrder(order);
        renderOrder();
      }

      /* ===================== REMOVE PRODUCT ===================== */
      function removeOne(productId) {
        const order = loadOrder();
        const index = order.items.findIndex(i => String(i.id) === String(productId));
        if (index === -1) return;

        order.items[index].qty -= 1;

        if (order.items[index].qty <= 0) {
          order.items.splice(index, 1);
        }

        if (order.items.length === 0) {
          order.id = null;
        }

        saveOrder(order);
        renderOrder();
      }

      /* ===================== LISTEN FROM menular2.html ===================== */
      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== "ADD_TO_ORDER") return;
        addProduct(event.data.productId);
      });

      /* ===================== INITIAL RENDER ===================== */
      renderOrder();
    });

    function goback() {
      window.location.href = "GARSON.html";
    }

    function iptal() {
      const masa = new URLSearchParams(window.location.search).get("masa") || "1";

      if (confirm("Are you sure you want to cancel the order?")) {
        localStorage.removeItem("menulux_order_table_" + masa + "_v1");
        window.location.href = "GARSON.html";
      }
    }
    </script>
</head>

<body>
    <!-- Header Navigation -->
    <header class="div0">
        <div class="header-left">
            <input class="item35" type="button" value="↩ " onclick="goback()">
            <div class="header-title-group">
                <p class="header-subtitle">ORDER SCREEN</p>
                <h1 class="item31">Table 1 - Status: OCCUPIED</h1>
            </div>
        </div>
        <input class="item34" type="button" value="TABLE ACTIONS" onclick="window.location.href='masaislamri.html'">
    </header>

    <!-- Main Workspace Container -->
    <main class="workspace">
        <!-- Left Column: Order Panel & Actions -->
        <div class="left-panel">
            <div class="div1">
                <div class="order-header-row">
                    <h1 class="item1">CURRENT ORDERS</h1>
                    <input class="item2" type="button" value="ORDER: AWAITING PAYMENT" onclick="window.location.href='GARSON.html'">
                </div>

                <div class="divider-line"></div>

                <div class="div2" id="orderBox">
                    <div id="orderItems"></div>
                </div>

                <h1 class="item8" id="orderTotal">TOTAL: 0 TL</h1>
            </div>

            <div class="div3">
                <input class="item9" id="btnKitchen" type="button" value="SEND TO KITCHEN">
                <input class="item10" id="btnCash" type="button" value="SEND TO CASH REGISTER">
                <input type="button" class="item11" value="CANCEL ORDER" onclick="iptal()">
            </div>
        </div>

        <!-- Right Column: Interactive Menu Frame -->
        <iframe src="menular2.html" id="frame"></iframe>
    </main>
</body>
</html>
