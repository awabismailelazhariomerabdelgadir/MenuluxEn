<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Welcome - Add New Product</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        /* Reset & Base Setup */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: rgb(248, 247, 247);
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            color: rgb(30, 52, 80);
        }

        /* Top Header Navigation */
        .div0 {  
            background-color: rgb(255, 253, 253);
            display: flex;
            align-items: center;
            height: 70px;
            width: 100%;
            border-bottom: silver 1px solid;
            padding: 0 16px;
            gap: 15px;
        }

        .back-link {
            text-decoration: none;
            display: inline-flex;
        }

        .item19 {
            font-size: 23px;
            color: #E1B12C;
            background-color: rgb(248, 247, 247);
            border: #E1B12C solid 2px;
            cursor: pointer;
            border-radius: 50%;
            height: 38px;
            width: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
        }

        .item19:hover {
            background-color: #E1B12C;
            color: #ffffff;
        }

        .item20 {
            color: rgb(30, 52, 80);
            font-size: 22px;
            font-weight: bold;
        }

        /* Form Container Wrapper */
        .main-wrapper {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 25px 15px;
        }

        .div1 {
            width: 100%;
            background-color: rgb(248, 247, 247);
        }

        /* Form Controls & Grouping */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .item0 {
            font-size: 16px;
            font-weight: 600;
            color: rgb(30, 52, 80);
        }

        .item1 {
            height: 52px;
            width: 100%;
            border: none;
            border-top: silver 1px solid;
            border-bottom: silver 1px solid;
            background-color: #ffffff;
            padding: 0 14px;
            font-size: 16px;
            color: rgb(30, 52, 80);
            outline: none;
            border-radius: 6px;
            transition: border-color 0.2s;
        }

        .item1:focus {
            border-color: #E1B12C;
        }

        .item1::placeholder {
            font-size: 15px;
            color: #888888;
        }

        select.item1 {
            cursor: pointer;
        }

        /* Action Buttons */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .item2 {
            border-radius: 12px;
            border: none;
            height: 52px;
            width: 100%;
            background-color: #E1B12C;
            color: rgb(30, 52, 80);
            font-weight: bold;
            font-size: 17px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .item2:hover {
            opacity: 0.9;
        }

        .item3 {
            border-radius: 12px;
            border: none;
            height: 52px;
            width: 100%;
            background-color: rgb(197, 34, 34);
            color: white;
            font-weight: bold;
            font-size: 17px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .item3:hover {
            opacity: 0.9;
        }

        /* Add/Edit Picture UI Box */
        .photoBox {
            height: 200px;
            width: 100%;
            border: silver 1px solid;
            border-radius: 12px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .photoBox img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            background: #ffffff;
        }

        .photoAddBtn {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            height: 48px;
            width: 48px;
            border-radius: 50%;
            border: none;
            background-color: #E1B12C;
            color: rgb(30, 52, 80);
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.18);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photoRemoveBtn {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            height: 48px;
            width: 48px;
            border-radius: 50%;
            border: none;
            background-color: rgb(197, 34, 34);
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.18);
            display: none;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <!-- Header Section -->
    <div class="div0">
        <a href="mutfak.html" class="back-link">
            <span class="material-symbols-outlined item19">replay</span>
        </a>
        <h1 class="item20">ADD NEW PRODUCT</h1>
    </div>

    <!-- Main Container Wrapper -->
    <main class="main-wrapper">
        <div class="div1">
            <form id="addProductForm">
                
                <!-- Product Photo Field -->
                <div class="form-group">
                    <label class="item0">Product Photo:</label>
                    <div class="photoBox" id="photoBox">
                        <img id="photoPreview" alt="Product Preview" />
                        <button type="button" class="photoAddBtn" id="photoAddBtn">+</button>
                        <button type="button" class="photoRemoveBtn" id="photoRemoveBtn">×</button>

                        <input
                            type="file"
                            id="urun_fotografi"
                            name="urun_fotografi"
                            accept="image/*"
                            style="display:none"
                        />
                    </div>
                </div>

                <!-- Product Name Field -->
                <div class="form-group">
                    <label class="item0" for="urun_adi">Product Name:</label>
                    <input class="item1" type="text" id="urun_adi" placeholder="e.g. Roasted Meat" required>
                </div>

                <!-- Price Field -->
                <div class="form-group">
                    <label class="item0" for="fiyat">Price (TL):</label>
                    <input class="item1" type="number" id="fiyat" step="0.01" placeholder="0.00" required>
                </div>

                <!-- Category Selection Field -->
                <div class="form-group">
                    <label class="item0" for="kategori">Category:</label>
                    <select class="item1" id="kategori" required></select>
                </div>

                <!-- Action Controls -->
                <div class="button-group">
                    <input class="item2" type="submit" value="SAVE AND ADD">
                    <input class="item3" type="button" value="CANCEL" onclick="window.location.href='mutfak.html'">
                </div>

            </form>
        </div>
    </main>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const STORAGE_KEY = "menulux_products_v1";
        const CAT_KEY = "menulux_categories_v1";
        
        renderCategories();

        function loadProducts() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
            catch { return []; }
        }

        function loadCategories() {
            try { return JSON.parse(localStorage.getItem(CAT_KEY)) || []; }
            catch { return []; }
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function renderCategories() {
            const cats = loadCategories();
            const select = document.getElementById("kategori");

            select.innerHTML = cats.map(c =>
                `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`
            ).join("");
        }

        function saveProducts(arr) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
        }

        let imageDataUrl = "";

        const fileInput = document.getElementById("urun_fotografi");
        const photoPreview = document.getElementById("photoPreview");
        const photoAddBtn = document.getElementById("photoAddBtn");
        const photoRemoveBtn = document.getElementById("photoRemoveBtn");
        const photoBox = document.getElementById("photoBox");

        function clearImage() {
            imageDataUrl = "";
            fileInput.value = "";
            photoPreview.src = "";
            photoPreview.style.display = "none";
            photoRemoveBtn.style.display = "none";
        }

        // Click + to choose file
        photoAddBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        // Click box to choose file (excluding action buttons)
        photoBox.addEventListener("click", (e) => {
            if (e.target === photoAddBtn || e.target === photoRemoveBtn) return;
            fileInput.click();
        });

        // Remove selected image
        photoRemoveBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            clearImage();
        });

        // Preview + convert to base64
        fileInput.addEventListener("change", () => {
            const file = fileInput.files && fileInput.files[0];
            if (!file) return;

            if (!file.type.startsWith("image/")) {
                alert("Please select a valid image file.");
                clearImage();
                return;
            }

            const reader = new FileReader();
            reader.onload = () => {
                imageDataUrl = String(reader.result || "");
                photoPreview.src = imageDataUrl;
                photoPreview.style.display = "block";
                photoRemoveBtn.style.display = "flex";
            };
            reader.readAsDataURL(file);
        });

        const form = document.getElementById("addProductForm");
        form.addEventListener("submit", (e) => {
            e.preventDefault();

            const name = document.getElementById("urun_adi").value.trim();
            const price = Number(document.getElementById("fiyat").value);
            const category = document.getElementById("kategori").value;

            if (!name) return alert("Product name cannot be empty.");
            if (!Number.isFinite(price) || price < 0) return alert("Price must be valid.");

            const products = loadProducts();
            products.push({
                id: Date.now().toString(),
                name,
                price,
                category,
                image: imageDataUrl || null
            });

            saveProducts(products);
            window.location.href = "menular.html";
        });
    });
    </script>
</body>
</html>
