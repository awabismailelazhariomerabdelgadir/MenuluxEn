<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Product Deletion</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: rgb(252, 251, 251);
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .header-bar {
            background-color: rgb(252, 251, 251);
            height: 70px;
            display: flex;
            align-items: center;
        }

        .icon-back {
            font-size: 23px;
            margin-left: 20px;
            color: #E1B12C;
            background-color: rgb(252, 251, 251);
            border: #E1B12C solid 2px;
            cursor: pointer;
            border-radius: 50%;
            height: 37px;
            width: 37px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .title-main {
            color: rgb(30, 52, 80);
            margin-left: 20px;
            font-size: 25px;
            font-weight: bold;
        }

        .subheader-bar {
            height: 70px;
            width: 100%;
            border-bottom: silver 1px solid;
            border-top: silver 1px solid;
            background-color: rgb(252, 251, 251);
            padding: 10px 16px;
        }

        .subheader-bar h1 {
            color: rgb(221, 25, 25);
            font-size: 20px;
            margin: 2px 0 0 0;
        }

        .subheader-bar p {
            color: rgb(133, 132, 129);
            font-size: 14px;
            margin: 0;
        }

        .category-container {
            height: 80px;
            width: 98%;
            margin: 15px auto;
            background-color: rgb(223, 221, 221);
            border-radius: 12px;
            overflow-x: auto;
            white-space: nowrap;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-category {
            border: none;
            background-color: rgb(247, 246, 246);
            color: rgb(62, 62, 71);
            height: 50px;
            min-width: 140px;
            padding: 0 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .btn-category:hover, 
        .btn-category.active {
            background-color: rgb(241, 173, 62);
            color: white;
        }

        .product-grid {
            margin: 20px 15px;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .product-card {
            background-color: rgb(245, 243, 243);
            color: rgb(30, 52, 80);
            height: 175px;
            width: 140px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(221, 25, 25, 0.3);
            border: 1px solid rgb(221, 25, 25);
        }

        .product-card h1 {
            font-size: 15px;
            margin: 8px 10px 4px 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-card p {
            font-size: 14px;
            margin: 0 10px;
            color: #cea837;
            font-weight: bold;
        }

        .prod-img {
            width: 100%;
            height: 90px;
            object-fit: contain;
            background: white;
            display: block;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .empty-message {
            margin-left: 15px;
            color: rgb(133, 132, 129);
            font-style: italic;
        }
    </style>
</head>
<body>

    <header class="header-bar">
        <a href="mutfak.html"><span class="material-symbols-outlined icon-back">replay</span></a>
        <h1 class="title-main">MENU</h1>
    </header>

    <section class="subheader-bar">
        <p>SELECT A PRODUCT TO DELETE</p>
        <h1>DELETE PRODUCT</h1>
    </section>

    <nav class="category-container" id="categoryButtons"></nav>

    <main>
        <div class="product-grid" id="productsList"></div>
    </main>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const CAT_KEY = "menulux_categories_v1";
    const STORAGE_KEY = "menulux_products_v1";
    const catContainer = document.getElementById("categoryButtons");
    const listEl = document.getElementById("productsList");
    let activeCategory = "";

    function loadCategories() {
        try { return JSON.parse(localStorage.getItem(CAT_KEY)) || []; }
        catch { return []; }
    }

    function loadProducts() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
        catch { return []; }
    }

    function saveProducts(arr) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    }

    function normTR(s) {
        return (s || "")
            .toLowerCase()
            .replaceAll("ı", "i")
            .replaceAll("İ", "i")
            .replaceAll("ç", "c")
            .replaceAll("ş", "s")
            .replaceAll("ğ", "g")
            .replaceAll("ö", "o")
            .replaceAll("ü", "u")
            .trim();
    }

    function formatCurrency(n) {
        const num = Number(n);
        return "$" + (Number.isFinite(num) ? num.toFixed(2) : "0.00");
    }

    function escapeHtml(str) {
        return String(str || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    const PLACEHOLDER_IMG =
        'data:image/svg+xml;utf8,' +
        encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" width="400" height="240">
                <rect width="100%" height="100%" fill="#ffffff"/>
                <rect x="10" y="10" width="380" height="220" rx="18" ry="18" fill="#f5f3f3" stroke="#d9d9d9"/>
                <text x="200" y="130" text-anchor="middle" font-size="28" fill="#1e3450" font-family="Arial">No Image</text>
            </svg>
        `);

    function renderCategories() {
        const cats = loadCategories();

        if (cats.length === 0) {
            catContainer.innerHTML = `<span class="empty-message">No categories found.</span>`;
            listEl.innerHTML = "";
            return;
        }

        catContainer.innerHTML = cats.map(c => `
            <button class="btn-category ${normTR(c.name) === normTR(activeCategory) ? 'active' : ''}" 
                    data-name="${escapeHtml(c.name)}">
                ${escapeHtml(c.name)}
            </button>
        `).join("");

        catContainer.querySelectorAll(".btn-category").forEach(btn => {
            btn.addEventListener("click", () => {
                catContainer.querySelectorAll(".btn-category").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                renderCategory(btn.getAttribute("data-name"));
            });
        });

        if (!activeCategory && cats.length) {
            activeCategory = cats[0].name;
            const firstBtn = catContainer.querySelector(".btn-category");
            if (firstBtn) firstBtn.classList.add("active");
        }
        
        renderCategory(activeCategory);
    }

    function renderCategory(catText) {
        activeCategory = catText;
        const products = loadProducts();
        const filtered = products.filter(p => normTR(p.category) === normTR(catText));

        if (filtered.length === 0) {
            listEl.innerHTML = `<p class="empty-message">No products in this category.</p>`;
            return;
        }

        listEl.innerHTML = filtered.map(p => {
            const imgSrc = (p.image && String(p.image).startsWith("data:image/")) ? p.image : PLACEHOLDER_IMG;

            return `
                <div class="product-card" data-id="${escapeHtml(p.id)}" data-name="${escapeHtml(p.name)}">
                    <img class="prod-img" src="${imgSrc}" alt="${escapeHtml(p.name)}">
                    <h1>${escapeHtml(p.name)}</h1>
                    <p>${formatCurrency(p.price)}</p>
                </div>
            `;
        }).join("");

        listEl.querySelectorAll(".product-card").forEach(card => {
            card.addEventListener("click", () => {
                const id = card.getAttribute("data-id");
                const name = card.getAttribute("data-name") || "This product";

                if (!confirm(`Are you sure you want to delete "${name}"?`)) return;

                const all = loadProducts();
                const updated = all.filter(p => String(p.id) !== String(id));
                saveProducts(updated);

                renderCategory(activeCategory);
            });
        });
    }

    renderCategories();
});
</script>
</body>
</html>
